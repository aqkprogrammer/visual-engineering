name: Bug report
description: Something on the site doesn't work, looks broken, or isn't accessible.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or path where it happens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and settings
      description: For example Firefox 140 on Android, dark theme, reduced motion, screen reader.
